[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Board settings
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB

; Upload & monitor
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0

; Partition scheme with OTA
board_build.partitions = default_8MB.csv

; Build flags
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -DXPT2046_CS=3
    -DTOUCH_CS=3
    -DTFT_CS=10
    -DTFT_RST=5
    -DTFT_DC=7
    -DTFT_BL=38
    -DTFT_MOSI=11
    -DTFT_MISO=13
    -DTFT_SCLK=12
    -DLED_PIN=48
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER
    -DUSE_FSPI_PORT
    -DINIT_SEQUENCE_3
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DSPI_FREQUENCY=20000000
    -DSPI_READ_FREQUENCY=6000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -Wno-unused-variable
    -Wno-unused-function

lib_deps =
    ; Display driver
    bodmer/TFT_eSPI @ ^2.5.43
    ; WS2812 NeoPixel
    adafruit/Adafruit NeoPixel @ ^1.12.3
    ; Wallpaper decoding (JPEG and Animated GIF)
    bodmer/TJpg_Decoder @ ^1.1.0
    bitbank2/AnimatedGIF @ ^2.2.3
    ; WiFiManager for captive portal
    tzapu/WiFiManager @ ^2.0.17
    ; ArduinoJson for weather API
    bblanchon/ArduinoJson @ ^7.3.1
    ; NTP time
    arduino-libraries/NTPClient @ ^3.2.1
    ; BLE
    ; (BLE is built-in for ESP32)

; Extra scripts
extra_scripts =
